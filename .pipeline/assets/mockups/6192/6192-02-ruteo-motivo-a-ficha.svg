<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif">
  <title>#6192 — Ruteo del motivo del gate a la ficha de decision</title>
  <desc>Los seis motivos que emite operator-signoff-gate.js, la ficha que corresponde a cada uno, lo que el clasificador por texto devuelve hoy, y si el aviso lleva botonera.</desc>

  <defs>
    <linearGradient id="marca2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D6FF"/>
      <stop offset="1" stop-color="#1890FF"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="900" fill="#0D1117"/>
  <rect x="0" y="0" width="1440" height="6" fill="url(#marca2)"/>

  <text x="48" y="62" fill="#E6EDF3" font-size="26" font-weight="700">#6192 · De qué frenó el gate a qué ve el operador</text>
  <text x="48" y="90" fill="#8B949E" font-size="15">El tipo de ficha lo resuelve quien llama, a partir del resultado del gate. Nunca el clasificador por texto: medido sobre HEAD 0c1875873, se equivoca en cuatro de seis motivos.</text>

  <!-- Cabecera de columnas -->
  <text x="64" y="146" fill="#6E7681" font-size="12" font-weight="700" letter-spacing="1">MOTIVO QUE DEVUELVE EL GATE</text>
  <text x="612" y="146" fill="#6E7681" font-size="12" font-weight="700" letter-spacing="1">FICHA CORRECTA</text>
  <text x="900" y="146" fill="#6E7681" font-size="12" font-weight="700" letter-spacing="1">HOY, POR TEXTO</text>
  <text x="1206" y="146" fill="#6E7681" font-size="12" font-weight="700" letter-spacing="1">BOTONES</text>
  <line x1="48" y1="158" x2="1392" y2="158" stroke="#30363D"/>

  <!-- Fila A -->
  <g>
    <rect x="48" y="172" width="1344" height="96" rx="10" fill="#161B22" stroke="#1F6FEB" stroke-opacity="0.6"/>
    <circle cx="76" cy="220" r="13" fill="rgba(24,144,255,0.18)" stroke="#1F6FEB"/>
    <text x="76" y="225" text-anchor="middle" fill="#58A6FF" font-size="12" font-weight="700">A</text>
    <text x="102" y="206" fill="#E6EDF3" font-size="14" font-weight="600">Nunca se firmó</text>
    <text x="102" y="228" fill="#8B949E" font-size="12" font-family="Consolas, monospace">sin firma del operador para la definición</text>
    <text x="102" y="250" fill="#6E7681" font-size="11.5">El caso que reportó el operador el 19/08 y el que domina el volumen</text>

    <rect x="604" y="196" width="132" height="30" rx="15" fill="rgba(63,185,80,0.14)" stroke="#3FB950"/>
    <text x="670" y="216" text-anchor="middle" fill="#3FB950" font-size="12.5" font-weight="700">firma</text>
    <text x="604" y="246" fill="#8B949E" font-size="11.5">tipo:'firma' + firmantes_autorizados</text>

    <rect x="892" y="196" width="180" height="30" rx="15" fill="rgba(248,81,73,0.14)" stroke="#F85149"/>
    <text x="982" y="216" text-anchor="middle" fill="#F85149" font-size="12.5" font-weight="700">indeterminado</text>
    <text x="892" y="246" fill="#F85149" font-size="11.5">0 opciones — CA-1 y CA-2 caen</text>

    <rect x="1206" y="200" width="64" height="26" rx="13" fill="rgba(63,185,80,0.14)" stroke="#3FB950"/>
    <text x="1238" y="218" text-anchor="middle" fill="#3FB950" font-size="12" font-weight="700">3</text>
  </g>

  <!-- Fila B -->
  <g>
    <rect x="48" y="280" width="1344" height="96" rx="10" fill="#161B22" stroke="#1F6FEB" stroke-opacity="0.6"/>
    <circle cx="76" cy="328" r="13" fill="rgba(24,144,255,0.18)" stroke="#1F6FEB"/>
    <text x="76" y="333" text-anchor="middle" fill="#58A6FF" font-size="12" font-weight="700">B</text>
    <text x="102" y="314" fill="#E6EDF3" font-size="14" font-weight="600">Firmó, y después cambiaron los criterios</text>
    <text x="102" y="336" fill="#8B949E" font-size="12" font-family="Consolas, monospace">firma stale (anti-TOCTOU A08)…</text>
    <text x="102" y="358" fill="#6E7681" font-size="11.5">Única variante donde la pregunta cambia: «¿Confirmás el alcance nuevo?»</text>

    <rect x="604" y="304" width="132" height="30" rx="15" fill="rgba(63,185,80,0.14)" stroke="#3FB950"/>
    <text x="670" y="324" text-anchor="middle" fill="#3FB950" font-size="12.5" font-weight="700">firma</text>
    <text x="604" y="354" fill="#8B949E" font-size="11.5">+ firma_vencida: true</text>

    <rect x="892" y="304" width="180" height="30" rx="15" fill="rgba(248,81,73,0.14)" stroke="#F85149"/>
    <text x="982" y="324" text-anchor="middle" fill="#F85149" font-size="12.5" font-weight="700">indeterminado</text>
    <text x="892" y="354" fill="#F85149" font-size="11.5">pierde el «ya lo habías firmado»</text>

    <rect x="1206" y="308" width="64" height="26" rx="13" fill="rgba(63,185,80,0.14)" stroke="#3FB950"/>
    <text x="1238" y="326" text-anchor="middle" fill="#3FB950" font-size="12" font-weight="700">3</text>
  </g>

  <!-- Fila C -->
  <g>
    <rect x="48" y="388" width="1344" height="96" rx="10" fill="#161B22" stroke="#D29922" stroke-opacity="0.6"/>
    <circle cx="76" cy="436" r="13" fill="rgba(210,153,34,0.18)" stroke="#D29922"/>
    <text x="76" y="441" text-anchor="middle" fill="#D29922" font-size="12" font-weight="700">C</text>
    <text x="102" y="422" fill="#E6EDF3" font-size="14" font-weight="600">No hay ningún firmante configurado</text>
    <text x="102" y="444" fill="#8B949E" font-size="12" font-family="Consolas, monospace">firmante no verificable (sin authorizedSigners…)</text>
    <text x="102" y="466" fill="#6E7681" font-size="11.5">Ninguna firma sería válida: pedir que firme es ofrecer algo inejecutable</text>

    <rect x="604" y="412" width="180" height="30" rx="15" fill="rgba(210,153,34,0.14)" stroke="#D29922"/>
    <text x="694" y="432" text-anchor="middle" fill="#D29922" font-size="12.5" font-weight="700">indeterminado</text>
    <text x="604" y="462" fill="#8B949E" font-size="11.5">tipo:'indeterminado' + firmantes_autorizados: 0</text>

    <rect x="892" y="412" width="180" height="30" rx="15" fill="rgba(63,185,80,0.14)" stroke="#3FB950"/>
    <text x="982" y="432" text-anchor="middle" fill="#3FB950" font-size="12.5" font-weight="700">indeterminado ✓</text>
    <text x="892" y="462" fill="#8B949E" font-size="11.5">acierta, pero por el guard de f_aut=0, no por el ruteo</text>

    <rect x="1206" y="416" width="64" height="26" rx="13" fill="rgba(248,81,73,0.14)" stroke="#F85149"/>
    <text x="1238" y="434" text-anchor="middle" fill="#F85149" font-size="12" font-weight="700">0</text>
  </g>

  <!-- Fila D -->
  <g>
    <rect x="48" y="496" width="1344" height="76" rx="10" fill="#161B22" stroke="#30363D"/>
    <circle cx="76" cy="534" r="13" fill="rgba(210,153,34,0.18)" stroke="#D29922"/>
    <text x="76" y="539" text-anchor="middle" fill="#D29922" font-size="12" font-weight="700">D</text>
    <text x="102" y="526" fill="#E6EDF3" font-size="14" font-weight="600">Firmó alguien que no está autorizado</text>
    <text x="102" y="548" fill="#8B949E" font-size="12" font-family="Consolas, monospace">firmante '&lt;x&gt;' no autorizado (A01…)</text>

    <rect x="604" y="518" width="180" height="30" rx="15" fill="rgba(210,153,34,0.14)" stroke="#D29922"/>
    <text x="694" y="538" text-anchor="middle" fill="#D29922" font-size="12.5" font-weight="700">indeterminado</text>

    <rect x="892" y="518" width="132" height="30" rx="15" fill="rgba(248,81,73,0.14)" stroke="#F85149"/>
    <text x="958" y="538" text-anchor="middle" fill="#F85149" font-size="12.5" font-weight="700">firma</text>
    <text x="892" y="568" fill="#F85149" font-size="11.5">3 botones — el único que hoy los da, y es el que no debe</text>

    <rect x="1206" y="522" width="64" height="26" rx="13" fill="rgba(248,81,73,0.14)" stroke="#F85149"/>
    <text x="1238" y="540" text-anchor="middle" fill="#F85149" font-size="12" font-weight="700">0</text>
  </g>

  <!-- Fila E -->
  <g>
    <rect x="48" y="584" width="1344" height="76" rx="10" fill="#161B22" stroke="#30363D"/>
    <circle cx="76" cy="622" r="13" fill="rgba(139,148,158,0.18)" stroke="#8B949E"/>
    <text x="76" y="627" text-anchor="middle" fill="#8B949E" font-size="12" font-weight="700">E</text>
    <text x="102" y="614" fill="#E6EDF3" font-size="14" font-weight="600">La firma llegó con un veredicto que no se entiende</text>
    <text x="102" y="636" fill="#8B949E" font-size="12" font-family="Consolas, monospace">verdict inválido '&lt;x&gt;'</text>

    <rect x="604" y="606" width="180" height="30" rx="15" fill="rgba(210,153,34,0.14)" stroke="#D29922"/>
    <text x="694" y="626" text-anchor="middle" fill="#D29922" font-size="12.5" font-weight="700">indeterminado</text>

    <rect x="892" y="606" width="180" height="30" rx="15" fill="rgba(63,185,80,0.14)" stroke="#3FB950"/>
    <text x="982" y="626" text-anchor="middle" fill="#3FB950" font-size="12.5" font-weight="700">indeterminado ✓</text>

    <rect x="1206" y="610" width="64" height="26" rx="13" fill="rgba(139,148,158,0.14)" stroke="#8B949E"/>
    <text x="1238" y="628" text-anchor="middle" fill="#8B949E" font-size="12" font-weight="700">0</text>
  </g>

  <!-- Fila F -->
  <g>
    <rect x="48" y="672" width="1344" height="96" rx="10" fill="#161B22" stroke="#30363D"/>
    <circle cx="76" cy="720" r="13" fill="rgba(139,148,158,0.18)" stroke="#8B949E"/>
    <text x="76" y="725" text-anchor="middle" fill="#8B949E" font-size="12" font-weight="700">F</text>
    <text x="102" y="706" fill="#E6EDF3" font-size="14" font-weight="600">El operador ya decidió: rechazó o pidió re-definir</text>
    <text x="102" y="728" fill="#8B949E" font-size="12" font-family="Consolas, monospace">operador rechazó la definición… / marcó re-definición…</text>
    <text x="102" y="750" fill="#6E7681" font-size="11.5">Volver a preguntarle «¿Aprobás el alcance?» es un bucle sobre su propia decisión</text>

    <rect x="604" y="696" width="180" height="30" rx="15" fill="rgba(139,148,158,0.14)" stroke="#8B949E"/>
    <text x="694" y="716" text-anchor="middle" fill="#B1BAC4" font-size="12.5" font-weight="700">ninguna ficha</text>
    <text x="604" y="746" fill="#8B949E" font-size="11.5">línea informativa, plana y deduplicada</text>

    <rect x="892" y="696" width="132" height="30" rx="15" fill="rgba(248,81,73,0.14)" stroke="#F85149"/>
    <text x="958" y="716" text-anchor="middle" fill="#F85149" font-size="12.5" font-weight="700">rebote</text>
    <text x="892" y="746" fill="#F85149" font-size="11.5">con opción recomendada — viola CA-5 por la puerta de atrás</text>

    <rect x="1206" y="700" width="64" height="26" rx="13" fill="rgba(139,148,158,0.14)" stroke="#8B949E"/>
    <text x="1238" y="718" text-anchor="middle" fill="#8B949E" font-size="12" font-weight="700">0</text>
  </g>

  <!-- Nota final -->
  <rect x="48" y="792" width="1344" height="62" rx="10" fill="rgba(24,144,255,0.07)" stroke="#1F6FEB" stroke-opacity="0.45"/>
  <text x="72" y="818" fill="#58A6FF" font-size="13.5" font-weight="700">firmantes_autorizados se pasa siempre, en las seis filas.</text>
  <text x="72" y="840" fill="#B1BAC4" font-size="12.5">Es lo único que impide que C y D vuelvan a ofrecer tres botones de firma el día que alguien toque el ruteo. Y ficha sin opciones ⇒ mensaje sin botonera: una botonera sobre «no te propongo opciones» se contradice sola.</text>

  <text x="48" y="882" fill="#6E7681" font-size="11.5">Sistema visual: .pipeline/assets/design-tokens.css — cero color nuevo, cero ícono nuevo. Estado «hoy» medido con decision-card.js sobre HEAD 0c1875873.</text>
</svg>
