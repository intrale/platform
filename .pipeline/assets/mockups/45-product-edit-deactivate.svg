<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 720" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <!-- =====================================================================
       Mockup 45 — Gestion de producto: Editar descriptor + Dar de baja
       Issue #4806 (Ola Puente). Pieza sobre la pestana Productos
       (views/dashboard/estado-productos.js · mockup 36 panel 2).
       Sistema visual: design-tokens V3 (dark). Iconos del sprite:
         Editar → #ic-edit (lapiz, NUEVO en este issue)
         Desactivar / Archivado → #ic-archive-box (ya existente, soft-delete)
       Reglas: estado NUNCA por color solo (icono + rotulo · WCAG AA);
       la baja es ADVERTENCIA destructiva con nonce, no borrado fisico.
       ===================================================================== -->
  <defs>
    <style>
      .bg{fill:#0D1117}
      .panel{fill:#161B22;stroke:rgba(255,255,255,.12)}
      .fg{fill:#e6edf3}
      .dim{fill:#8A93A6}
      .soft{fill:#5B6376}
      .cyan{fill:#00D6FF}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
      .h{font-weight:800}
      .lbl{font-size:9px;font-weight:700;letter-spacing:.4px}
    </style>
    <symbol id="ic-edit" viewBox="0 0 24 24">
    <!-- Cuerpo del lapiz (diagonal, punta abajo-izquierda) -->
    <path d="M14.5 6.5 L17.5 9.5 L9 18 L5.3 18.7 L6 15 Z"
          fill="none" stroke="currentColor" stroke-width="1.75"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Extremo superior / virola (goma) -->
    <path d="M14.5 6.5 L16.6 4.4 A1.5 1.5 0 0 1 18.7 4.4 L19.6 5.3 A1.5 1.5 0 0 1 19.6 7.4 L17.5 9.5"
          fill="none" stroke="currentColor" stroke-width="1.75"
          stroke-linejoin="round"/>
    <!-- Union cuerpo/virola para leer la separacion de la goma -->
    <path d="M13.4 7.6 L16.4 10.6" fill="none" stroke="currentColor"
          stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
  </symbol>
    <symbol id="ic-archive-box" viewBox="0 0 24 24">
    <!-- Tapa -->
    <rect x="3" y="5" width="18" height="4.5" rx="1" fill="none" stroke="currentColor"
          stroke-width="1.75" stroke-linejoin="round"/>
    <!-- Caja -->
    <path d="M5 9.5 V19 A1.5 1.5 0 0 0 6.5 20.5 H17.5 A1.5 1.5 0 0 0 19 19 V9.5"
          fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
    <!-- Tirador central -->
    <path d="M10 13 H14" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
  </symbol>
    <symbol id="ic-intrale-logo" viewBox="0 0 24 24">
    <!-- Triangulo equilatero exterior (el "A" del logo) -->
    <path d="M12 3 L3 19 L21 19 Z" fill="none" stroke="currentColor" stroke-width="1.75"
          stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Triangulo interno rellenado -->
    <path d="M12 10 L8.8 15.3 L15.2 15.3 Z" fill="currentColor"/>
  </symbol>
  </defs>

  <rect class="bg" x="0" y="0" width="1040" height="720"/>

  <!-- Header -->
  <text x="32" y="44" class="fg h" font-size="18">🗂 Estado por producto</text>
  <text x="32" y="66" class="dim" font-size="12">Editar descriptor y dar de baja — cierre del ciclo de gestion (#4806)</text>
  <!-- Boton nuevo producto (contexto) -->
  <rect x="880" y="30" width="128" height="30" rx="8" fill="#00D6FF"/>
  <text x="944" y="50" text-anchor="middle" fill="#001b22" font-size="12" class="h">➕ Nuevo producto</text>

  <!-- ============================ CARD A · ACTIVE (acciones nuevas) ============================ -->
  <g transform="translate(32,96)">
    <rect class="panel" x="0" y="0" width="300" height="330" rx="12"/>
    <rect x="0" y="0" width="300" height="3" rx="1.5" fill="#00D6FF"/>
    <!-- head -->
    <circle cx="20" cy="30" r="6" fill="#00D6FF"/>
    <text x="34" y="34" class="fg h" font-size="14">Intrale</text>
    <rect x="196" y="20" width="86" height="20" rx="10" fill="rgba(63,185,80,.14)" stroke="rgba(63,185,80,.32)"/>
    <text x="239" y="34" text-anchor="middle" fill="#9be9a8" font-size="10.5" class="h">● Operando</text>
    <text x="20" y="58" class="soft mono" font-size="11">intrale · desarrollo</text>
    <!-- metrics -->
    <g transform="translate(20,72)">
      <rect x="0" y="0" width="62" height="42" rx="8" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.08)"/>
      <text x="31" y="22" text-anchor="middle" class="fg h" font-size="15">7</text>
      <text x="31" y="35" text-anchor="middle" class="soft lbl">ACTIVOS</text>
      <rect x="66" y="0" width="62" height="42" rx="8" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.08)"/>
      <text x="97" y="22" text-anchor="middle" class="fg h" font-size="15">12</text>
      <text x="97" y="35" text-anchor="middle" class="soft lbl">PEND.</text>
      <rect x="132" y="0" width="62" height="42" rx="8" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.08)"/>
      <text x="163" y="22" text-anchor="middle" fill="#fcd9a0" class="h" font-size="15">1</text>
      <text x="163" y="35" text-anchor="middle" class="soft lbl">BLOQ.</text>
      <rect x="198" y="0" width="62" height="42" rx="8" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.08)"/>
      <text x="229" y="22" text-anchor="middle" class="fg h" font-size="15">48</text>
      <text x="229" y="35" text-anchor="middle" class="soft lbl">PROC.</text>
    </g>
    <!-- wave row -->
    <rect x="20" y="126" width="260" height="30" rx="9" fill="rgba(45,212,191,.08)" stroke="rgba(45,212,191,.32)"/>
    <text x="32" y="145" fill="#9ff0e6" font-size="11.5" class="h">〜 Ola inicial — Asociada</text>

    <!-- Fila 1 de acciones: ciclo de vida (existente) -->
    <g transform="translate(20,170)">
      <rect x="0" y="0" width="84" height="34" rx="9" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.16)"/>
      <text x="42" y="21" text-anchor="middle" class="fg" font-size="12" class="h">⏸ Pausar</text>
      <rect x="90" y="0" width="170" height="34" rx="9" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.10)" opacity=".5"/>
      <text x="175" y="21" text-anchor="middle" class="dim" font-size="11">⏻ Activar · ▶ Arrancar (n/a)</text>
    </g>

    <!-- Fila 2 de acciones: NUEVAS (Editar + Desactivar) -->
    <g transform="translate(20,214)">
      <!-- Editar: secundario neutro, icono lapiz -->
      <rect x="0" y="0" width="126" height="36" rx="9" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.16)"/>
      <use href="#ic-edit" x="16" y="9" width="18" height="18" color="#e6edf3"/>
      <text x="80" y="23" text-anchor="middle" class="fg h" font-size="12.5">Editar</text>
      <!-- Desactivar: destructivo restringido (outline danger, no fill solido) -->
      <rect x="134" y="0" width="126" height="36" rx="9" fill="rgba(248,113,113,.08)" stroke="rgba(248,113,113,.32)"/>
      <use href="#ic-archive-box" x="150" y="9" width="18" height="18" color="#fca5a5"/>
      <text x="212" y="23" text-anchor="middle" fill="#fca5a5" class="h" font-size="12.5">Desactivar</text>
    </g>
    <text x="20" y="272" class="soft" font-size="10">Editar reabre el wizard prellenado · Desactivar pide confirmacion</text>
  </g>

  <!-- ============================ CARD B · ARCHIVED (nuevo estado) ============================ -->
  <g transform="translate(352,96)">
    <rect class="panel" x="0" y="0" width="300" height="330" rx="12" opacity=".78"/>
    <rect x="0" y="0" width="300" height="3" rx="1.5" fill="#5B6376"/>
    <circle cx="20" cy="30" r="6" fill="#8A93A6"/>
    <text x="34" y="34" class="dim h" font-size="14">Acme Retail</text>
    <!-- badge archivado (nuevo STATE_META) -->
    <rect x="192" y="20" width="90" height="20" rx="10" fill="rgba(138,147,166,.12)" stroke="rgba(138,147,166,.34)"/>
    <use href="#ic-archive-box" x="200" y="22" width="15" height="15" color="#a9b1c2"/>
    <text x="248" y="34" text-anchor="middle" fill="#a9b1c2" font-size="10.5" class="h">Archivado</text>
    <text x="20" y="58" class="soft mono" font-size="11">acme-retail · dado de baja</text>

    <rect x="20" y="74" width="260" height="52" rx="9" fill="rgba(255,255,255,.02)" stroke="rgba(255,255,255,.08)"/>
    <text x="32" y="96" class="dim" font-size="11">Soft-delete · status: archived</text>
    <text x="32" y="114" class="soft" font-size="10.5">El descriptor se conserva para auditoria (no se borra)</text>

    <!-- acciones deshabilitadas: no se puede reactivar por esta via -->
    <g transform="translate(20,214)">
      <rect x="0" y="0" width="126" height="36" rx="9" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.10)" opacity=".45"/>
      <use href="#ic-edit" x="16" y="9" width="18" height="18" color="#5B6376"/>
      <text x="80" y="23" text-anchor="middle" class="soft h" font-size="12.5">Editar</text>
      <rect x="134" y="0" width="126" height="36" rx="9" fill="rgba(248,113,113,.05)" stroke="rgba(248,113,113,.16)" opacity=".45"/>
      <use href="#ic-archive-box" x="150" y="9" width="18" height="18" color="#5B6376"/>
      <text x="212" y="23" text-anchor="middle" class="soft h" font-size="12.5">Desactivar</text>
    </g>
    <text x="20" y="272" class="soft" font-size="10">Acciones deshabilitadas · archived→active no existe (fail-closed)</text>
  </g>

  <!-- ============================ PANEL C · CONFIRM DESTRUCTIVO (baja con ola en curso) ============================ -->
  <g transform="translate(672,96)">
    <rect x="0" y="0" width="336" height="330" rx="12" fill="#1B2029" stroke="rgba(248,113,113,.35)"/>
    <rect x="0" y="0" width="336" height="4" rx="2" fill="#f87171"/>
    <use href="#ic-archive-box" x="20" y="20" width="26" height="26" color="#fca5a5"/>
    <text x="56" y="32" fill="#fca5a5" class="h" font-size="15">Dar de baja el producto</text>
    <text x="56" y="49" class="dim mono" font-size="12">"acme-retail"</text>

    <!-- advertencia de trabajo en curso (Gherkin CA-3) -->
    <rect x="20" y="66" width="296" height="70" rx="9" fill="rgba(210,153,34,.08)" stroke="rgba(210,153,34,.3)"/>
    <text x="34" y="88" fill="#fcd9a0" class="h" font-size="11.5">⚠ Tiene una ola activa en curso</text>
    <text x="34" y="107" class="dim" font-size="10.5">Los agentes ya despachados terminan solos.</text>
    <text x="34" y="123" class="dim" font-size="10.5">No recibira nuevos slots. Otros productos no se afectan.</text>

    <text x="20" y="160" class="soft" font-size="10.5">• Pasa a estado ARCHIVADO (soft-delete, auditable)</text>
    <text x="20" y="178" class="soft" font-size="10.5">• No se borra el descriptor</text>
    <text x="20" y="196" class="soft" font-size="10.5">• La ejecuta el kernel (el adaptador pide)</text>
    <text x="20" y="214" class="soft" font-size="10.5">• Protegido por nonce single-use (anti-TOCTOU)</text>

    <!-- botones del modal -->
    <rect x="20" y="238" width="150" height="40" rx="9" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.16)"/>
    <text x="95" y="263" text-anchor="middle" class="fg h" font-size="13">Cancelar</text>
    <rect x="182" y="238" width="134" height="40" rx="9" fill="#f87171"/>
    <text x="249" y="263" text-anchor="middle" fill="#2a0d0d" class="h" font-size="13">Dar de baja</text>
    <text x="20" y="300" class="soft" font-size="9.5">Confirmacion explicita · el boton no dispara sin el nonce emitido en la vista</text>
  </g>

  <!-- ============================ LEYENDA / GUIDELINE ============================ -->
  <g transform="translate(32,452)">
    <text x="0" y="0" class="fg h" font-size="13">Guideline visual (#4806)</text>
    <line x1="0" y1="12" x2="976" y2="12" stroke="rgba(0,214,255,.28)"/>

    <!-- iconografia -->
    <g transform="translate(0,30)">
      <text x="0" y="0" class="cyan h" font-size="11">ICONOGRAFIA (sprite, no emojis del SO en elementos nuevos)</text>
      <use href="#ic-edit" x="0" y="14" width="20" height="20" color="#e6edf3"/>
      <text x="28" y="29" class="fg" font-size="11">#ic-edit — Editar (lapiz, NUEVO)</text>
      <use href="#ic-archive-box" x="0" y="42" width="20" height="20" color="#fca5a5"/>
      <text x="28" y="57" class="fg" font-size="11">#ic-archive-box — Desactivar / Archivado</text>
      <text x="0" y="84" class="dim" font-size="10.5">Editar = accion secundaria, NUNCA color danger.</text>
      <text x="0" y="100" class="dim" font-size="10.5">Desactivar = destructivo restringido (outline danger,</text>
      <text x="0" y="114" class="dim" font-size="10.5">sin fill solido — es soft-delete reversible via re-alta).</text>
    </g>

    <!-- estados -->
    <g transform="translate(300,30)">
      <text x="0" y="0" class="cyan h" font-size="11">ESTADO (STATE_META · dual-encoding icono+rotulo · WCAG AA)</text>
      <rect x="0" y="12" width="96" height="20" rx="10" fill="rgba(63,185,80,.14)" stroke="rgba(63,185,80,.32)"/>
      <text x="48" y="26" text-anchor="middle" fill="#9be9a8" font-size="10" class="h">● Operando</text>
      <rect x="104" y="12" width="96" height="20" rx="10" fill="rgba(138,147,166,.12)" stroke="rgba(138,147,166,.34)"/>
      <text x="152" y="26" text-anchor="middle" fill="#a9b1c2" font-size="10" class="h">🗄 Archivado</text>
      <text x="0" y="52" class="dim" font-size="10.5">Nuevo: archived → color slate desaturado (#a9b1c2),</text>
      <text x="0" y="66" class="dim" font-size="10.5">distinto de inactive/unknown. Card al 78% opacidad.</text>
      <text x="0" y="86" class="soft" font-size="10">.ep-state-archived{color:#a9b1c2;</text>
      <text x="0" y="100" class="soft" font-size="10">background:rgba(138,147,166,.12);</text>
      <text x="0" y="114" class="soft" font-size="10">border:1px solid rgba(138,147,166,.34)}</text>
    </g>

    <!-- botones / tokens -->
    <g transform="translate(620,30)">
      <text x="0" y="0" class="cyan h" font-size="11">BOTONES (tokens, sin colores hardcodeados nuevos)</text>
      <rect x="0" y="12" width="120" height="30" rx="9" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.16)"/>
      <use href="#ic-edit" x="14" y="18" width="16" height="16" color="#e6edf3"/>
      <text x="74" y="31" text-anchor="middle" class="fg h" font-size="11.5">Editar</text>
      <rect x="132" y="12" width="130" height="30" rx="9" fill="rgba(248,113,113,.08)" stroke="rgba(248,113,113,.32)"/>
      <use href="#ic-archive-box" x="146" y="18" width="16" height="16" color="#fca5a5"/>
      <text x="204" y="31" text-anchor="middle" fill="#fca5a5" class="h" font-size="11.5">Desactivar</text>
      <text x="0" y="62" class="dim" font-size="10.5">.ep-btn-edit → estilo secundario (=pause).</text>
      <text x="0" y="78" class="dim" font-size="10.5">.ep-btn-deactivate → danger outline (#fca5a5).</text>
      <text x="0" y="98" class="dim" font-size="10.5">focus-visible: outline 2px var(--brand-cyan).</text>
      <text x="0" y="112" class="dim" font-size="10.5">Ambas habilitadas en active/onboarding; off en archived.</text>
    </g>
  </g>

  <!-- footer identidad -->
  <text x="32" y="700" class="soft" font-size="10">Intrale · Pipeline V3 dashboard — design-tokens V3 (dark) · mockup 45 · #4806</text>
  <use href="#ic-intrale-logo" x="980" y="682" width="24" height="24" color="#00D6FF"/>
</svg>
