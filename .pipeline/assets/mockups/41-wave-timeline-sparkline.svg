<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <!-- ============================================================
       Mockup UX — Issue #4500
       "Timeline de la ola" + sparkline de ritmo
       Reemplaza las 4 stat-cards (COMIENZO·ETA·VELOCIDAD·ENTREGADAS)
       + barra de avance separada, por un ÚNICO componente narrativo.
       Design tokens (theme.css): --in-bg #0d1117 · --in-bg-2 #161b22
       --in-ok #3fb950 · --in-info #58a6ff · --in-bad #f85149
       --in-fg #e6edf3 · --in-fg-dim #8b949e · brand-cyan #34D9E0 · accent #2ee6c1
       ============================================================ -->
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ee6c1"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34D9E0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#34D9E0" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#34D9E0" flood-opacity="0.9"/>
    </filter>
  </defs>

  <rect width="960" height="720" fill="#0d1117"/>
  <text x="32" y="42" fill="#e6edf3" font-size="20" font-weight="800">Timeline de la ola — mockup UX #4500</text>
  <text x="32" y="66" fill="#8b949e" font-size="13">Un solo componente con narrativa comienzo → ahora → cierre + sparkline de ritmo</text>

  <!-- =========================== ESTADO A: ola en curso =========================== -->
  <text x="32" y="110" fill="#2ee6c1" font-size="12" font-weight="800" letter-spacing="1.2">ESTADO A · OLA EN CURSO (datos suficientes)</text>

  <!-- banner card -->
  <rect x="32" y="124" width="896" height="212" rx="14" fill="#161b22" stroke="rgba(255,255,255,0.08)"/>
  <!-- watermark ola -->
  <text x="892" y="150" fill="#34D9E0" opacity="0.06" font-size="90" text-anchor="end">🌊</text>

  <!-- wavetag -->
  <rect x="52" y="146" width="92" height="90" rx="12" fill="rgba(52,217,224,0.08)" stroke="rgba(52,217,224,0.25)"/>
  <text x="98" y="176" fill="#9fe9ee" font-size="10" font-weight="800" letter-spacing="1.5" text-anchor="middle">OLA</text>
  <text x="98" y="214" fill="#bff3f6" font-size="34" font-weight="800" text-anchor="middle">3</text>

  <!-- title + desc -->
  <text x="164" y="166" fill="#e6edf3" font-size="18" font-weight="800">Ola 3 · Auditoría modelo operativo</text>
  <rect x="470" y="153" width="118" height="18" rx="9" fill="rgba(52,217,224,0.12)"/>
  <text x="529" y="166" fill="#34D9E0" font-size="10" font-weight="800" text-anchor="middle">ÚLTIMA DEL PLAN</text>
  <text x="164" y="188" fill="#8b949e" font-size="12.5">Ritmo de entrega y cierre estimado de un vistazo.</text>

  <!-- === TIMELINE === -->
  <!-- eje: comienzo (izq) -> ETA (der). now marker at 64% -->
  <g>
    <!-- etiquetas extremos -->
    <text x="164" y="228" fill="#8b949e" font-size="9.5" font-weight="800" letter-spacing="0.7">🗓 COMIENZO</text>
    <text x="164" y="243" fill="#e6edf3" font-size="13" font-weight="800">2 jul 09:54</text>

    <text x="892" y="228" fill="#8b949e" font-size="9.5" font-weight="800" letter-spacing="0.7" text-anchor="end">⏳ ETA CIERRE</text>
    <text x="892" y="243" fill="#e6edf3" font-size="13" font-weight="800" text-anchor="end">~8 jul 18:00</text>

    <!-- rail base -->
    <rect x="164" y="266" width="728" height="10" rx="5" fill="rgba(255,255,255,0.07)"/>
    <!-- fill de progreso SOBRE la misma línea (64%) -->
    <rect x="164" y="266" width="466" height="10" rx="5" fill="url(#fill)"/>
    <!-- ticks comienzo / eta -->
    <circle cx="164" cy="271" r="6" fill="#2ee6c1" stroke="#0d1117" stroke-width="2"/>
    <circle cx="892" cy="271" r="6" fill="#161b22" stroke="#8b949e" stroke-width="2"/>

    <!-- marcador AHORA a 64% (x = 164 + 0.64*728 = 630) -->
    <line x1="630" y1="256" x2="630" y2="286" stroke="#34D9E0" stroke-width="2"/>
    <circle cx="630" cy="271" r="7" fill="#34D9E0" stroke="#0d1117" stroke-width="2" filter="url(#glow)"/>
    <rect x="596" y="290" width="68" height="18" rx="9" fill="#34D9E0"/>
    <text x="630" y="303" fill="#0d1117" font-size="10.5" font-weight="800" text-anchor="middle">AHORA · 64%</text>

    <!-- anotación velocidad cerca del marcador -->
    <text x="630" y="252" fill="#3fb950" font-size="12" font-weight="800" text-anchor="middle">🚀 2,3 issues/día</text>

    <!-- anotación entregados hacia el final -->
    <text x="800" y="252" fill="#58a6ff" font-size="12" font-weight="800" text-anchor="middle">📦 14 / 22</text>
  </g>

  <!-- === SPARKLINE de ritmo (delta entre snapshots) === -->
  <text x="164" y="326" fill="#8b949e" font-size="9.5" font-weight="800" letter-spacing="0.7">📈 RITMO DE ENTREGA (últimos días)</text>
  <!-- área + polyline: acelera hacia el final -->
  <path d="M 470 320 L 500 316 L 530 318 L 560 310 L 590 312 L 620 302 L 650 305 L 680 294 L 710 296 L 740 285 L 770 288 L 800 278 L 830 270 L 860 266 L 892 262
           L 892 330 L 470 330 Z" fill="url(#spark)"/>
  <polyline points="470,320 500,316 530,318 560,310 590,312 620,302 650,305 680,294 710,296 740,285 770,288 800,278 830,270 860,266 892,262"
            fill="none" stroke="#34D9E0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="892" cy="262" r="3.2" fill="#34D9E0"/>
  <text x="892" y="326" fill="#3fb950" font-size="10" font-weight="700" text-anchor="end">▲ acelerando</text>

  <!-- =========================== ESTADO B: ola recién iniciada =========================== -->
  <text x="32" y="404" fill="#d29922" font-size="12" font-weight="800" letter-spacing="1.2">ESTADO B · OLA RECIÉN INICIADA (datos insuficientes → degrada con gracia)</text>

  <rect x="32" y="418" width="896" height="182" rx="14" fill="#161b22" stroke="rgba(255,255,255,0.08)"/>
  <text x="892" y="444" fill="#34D9E0" opacity="0.06" font-size="90" text-anchor="end">🌊</text>

  <rect x="52" y="440" width="92" height="90" rx="12" fill="rgba(52,217,224,0.08)" stroke="rgba(52,217,224,0.25)"/>
  <text x="98" y="470" fill="#9fe9ee" font-size="10" font-weight="800" letter-spacing="1.5" text-anchor="middle">OLA</text>
  <text x="98" y="508" fill="#bff3f6" font-size="34" font-weight="800" text-anchor="middle">4</text>

  <text x="164" y="460" fill="#e6edf3" font-size="18" font-weight="800">Ola 4 · recién activada</text>
  <text x="164" y="482" fill="#8b949e" font-size="12.5">Sin histórico de ritmo todavía. El layout no se rompe.</text>

  <!-- timeline con marcador cerca del inicio -->
  <text x="164" y="520" fill="#8b949e" font-size="9.5" font-weight="800" letter-spacing="0.7">🗓 COMIENZO</text>
  <text x="164" y="535" fill="#e6edf3" font-size="13" font-weight="800">hoy 10:12</text>
  <text x="892" y="520" fill="#8b949e" font-size="9.5" font-weight="800" letter-spacing="0.7" text-anchor="end">⏳ ETA CIERRE</text>
  <text x="892" y="535" fill="#8b949e" font-size="13" font-weight="800" text-anchor="end">— sin dato</text>

  <rect x="164" y="556" width="728" height="10" rx="5" fill="rgba(255,255,255,0.07)"/>
  <rect x="164" y="556" width="22" height="10" rx="5" fill="url(#fill)"/>
  <circle cx="164" cy="561" r="6" fill="#2ee6c1" stroke="#0d1117" stroke-width="2"/>
  <circle cx="892" cy="561" r="6" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
  <!-- marcador AHORA cerca del inicio (3%) -->
  <line x1="186" y1="546" x2="186" y2="576" stroke="#34D9E0" stroke-width="2"/>
  <circle cx="186" cy="561" r="7" fill="#34D9E0" stroke="#0d1117" stroke-width="2" filter="url(#glow)"/>
  <rect x="160" y="580" width="52" height="18" rx="9" fill="#34D9E0"/>
  <text x="186" y="593" fill="#0d1117" font-size="10.5" font-weight="800" text-anchor="middle">AHORA</text>
  <text x="300" y="542" fill="#8b949e" font-size="12" font-weight="700">🚀 — issues/día · 📦 0 / 18</text>

  <!-- sparkline placeholder -->
  <text x="470" y="542" fill="#8b949e" font-size="9.5" font-weight="800" letter-spacing="0.7">📈 RITMO</text>
  <line x1="520" y1="537" x2="892" y2="537" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.55"/>
  <text x="706" y="530" fill="#8b949e" font-size="10.5" text-anchor="middle" font-style="italic">datos insuficientes</text>

  <!-- =========================== notas =========================== -->
  <text x="32" y="644" fill="#8b949e" font-size="11.5" font-weight="700">Reglas de diseño:</text>
  <text x="32" y="664" fill="#8b949e" font-size="11">• Solo tokens existentes: fill=accent→ok · marcador/sparkline=brand-cyan · velocidad=ok · entregados=info · sin dato=fg-dim. Cero colores nuevos.</text>
  <text x="32" y="682" fill="#8b949e" font-size="11">• Marcador "ahora" left:clamp(0,100,avancePct)% sobre la MISMA línea del fill (reusar #mission-bar-progress). Anotaciones = texto, no cards.</text>
  <text x="32" y="700" fill="#8b949e" font-size="11">• Sparkline grafica el DELTA entre snapshots (ritmo), no el avance monótono. &lt;2 puntos → línea punteada + "datos insuficientes".</text>
</svg>
