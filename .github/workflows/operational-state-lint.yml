name: Operational State Lint

# Issue #5175 (parte 1 de 3 del split de #5109) — CA-4a, no-negociable: defensa
# en profundidad. El hook `.husky/pre-commit` local es bypassable con
# `--no-verify`; este job duplica el guardrail en CI. Mismo precedente que
# `ghost-artifact-lint.yml` (CA-SEC-8 de #3638).
#
# CORRE EN `--check` (ENFORCE) desde #5179 — el flip de la parte 3 del split.
# El inventario de accesos directos en produccion esta en CERO, asi que el
# guardrail ya no falla contra su propio repo (R5): de aca en mas un acceso
# directo NUEVO al estado operativo rompe el build.
#
# Historia del modo previo: las partes 1 (#5175) y 2 (#5176) corrieron en
# `--report-only` a proposito, porque un guardrail en `enforce` no puede
# mergearse antes que la migracion — habria dejado main rojo durante todo el
# split.
#
# El required check de branch protection se registra DESPUES del merge de este
# flip (#5183). Registrarlo antes dejaba el check rojo durante la migracion.
#
# `pull_request` y NUNCA `pull_request_target`: el segundo corre con el token
# del repo BASE y acceso a secrets sobre codigo de un fork.

# `.github/CODEOWNERS` esta en los `paths:` por #5986 (CA-5). Bajo la Opcion A
# decidida por el operador el archivo queda en modo `solo-comentarios`: CERO
# reglas de ownership activas. Lo que la suite de este job asegura es
# exactamente eso — que el modo siga siendo `solo-comentarios` y que no se
# reintroduzcan reglas por la ventana (`GATE_CODEOWNERS_ESPERADO=false`). Sin
# este path, un PR que toca UNICAMENTE CODEOWNERS no dispara el job — o sea, la
# asercion no corre en el unico PR donde importa. Precedente real: #5975 toco
# solo ese archivo y mergeo con 14 checks verdes, sin este job entre ellos.
on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - '.pipeline/**'
      - '.github/workflows/operational-state-lint.yml'
      - '.github/CODEOWNERS'
  push:
    branches: [ main ]
    paths:
      - '.pipeline/**'
      - '.github/CODEOWNERS'

# CA-4c — el job solo lee el checkout. Sin escritura sobre el repo.
permissions:
  contents: read

jobs:
  operational-state-lint:
    runs-on: ubuntu-latest
    name: Operational state lint (envoltorio requerido, enforce)
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Run operational-state lint (enforce)
        working-directory: .pipeline
        run: node lib/operational-state-lint.js --check

      # `always()` desde el flip a enforce (#5179): con el paso anterior en
      # `--check`, un fallo cortaria el job y el inventario no se publicaria
      # JUSTO en el run donde hace falta para diagnosticar. El resumen es la
      # unica salida legible del guardrail para quien no lee el log crudo.
      - name: Publicar inventario en el resumen del run
        if: always()
        working-directory: .pipeline
        run: node lib/operational-state-lint.js --report >> "$GITHUB_STEP_SUMMARY"

      # Idem: los unit tests del propio guardrail son informacion de diagnostico
      # y no deben quedar sin correr porque el repo tenga una violation.
      - name: Run operational-state lint unit tests
        if: always()
        working-directory: .pipeline
        run: node --test lib/__tests__/operational-state-lint.test.js
