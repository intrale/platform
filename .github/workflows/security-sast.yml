name: Security SAST

# Análisis de seguridad estático (#7659, decisión de #7658 filas 1, 3, 4 y 7).
#
# Qué corre cuándo:
#   PR a main/develop      → Secret scan (blocking) siempre.
#                            OWASP Dependency Check SÓLO si el PR toca dependencias
#                            (gradle/libs.versions.toml, **/*.gradle.kts, buildSrc/**).
#   push a main            → Secret scan (blocking).
#   schedule diario        → OWASP + Semgrep + detect-secrets sobre main, resumen en
#                            el step summary y aviso privado al operador.
#   workflow_dispatch      → lo mismo que el schedule, a demanda (correrlo antes de
#                            cada release / deploy a Lambda).
#
# OWASP, Semgrep y detect-secrets siguen en modo warning (continue-on-error): no
# bloquean nada. El único control bloqueante es "Secret scan (blocking)".
#
# NO usar `paths:` en on.pull_request: dejaría sin Secret scan a los PR que no
# tocan dependencias. El filtro de dependencias va a nivel job (detect-deps).
# NO poner `concurrency` a nivel workflow: cancelaría el Secret scan de pushes
# seguidos a main. La cancelación va sólo en los jobs pesados, grupo por job.

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * *'   # diario, 06:00 UTC / 03:00 ART (fila 1, 3 y 4 de #7658)
  # Sin inputs a propósito: no hay nada del usuario que termine interpolado en un run.
  workflow_dispatch: {}

# Privilegio mínimo global. Cada job que necesita más lo declara a nivel job
# (semgrep: security-events: write para subir el SARIF).
permissions:
  contents: read

jobs:
  # ── ¿El PR toca dependencias? (sólo pull_request) ───────────────
  # Se resuelve con git, sin API ni actions de terceros: no pide permisos extra.
  # Ante cualquier duda (no se puede calcular el diff) responde deps=true: correr
  # OWASP de más es preferible a saltearlo en un PR que sí cambió dependencias.
  detect-deps:
    if: github.event_name == 'pull_request'
    name: Detectar cambios de dependencias
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Clasificar archivos del PR
        id: filter
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Archivos de dependencias (fila 1 de #7658). ERE, lo valida
          # .pipeline/tests/security-sast-workflow.test.js.
          DEPS_PATTERN: '^gradle/libs\.versions\.toml$|(^|/)[^/]+\.gradle\.kts$|^buildSrc/'
        run: |
          CHANGED=""
          OK=0
          # En pull_request GITHUB_SHA es el merge commit efímero: parent1 es el
          # tip de la base, así que ^1..merge es exactamente lo que agrega el PR.
          if [ -n "$PR_HEAD_SHA" ] && [ "$GITHUB_SHA" != "$PR_HEAD_SHA" ] \
             && git rev-parse -q --verify "$GITHUB_SHA^2" >/dev/null 2>&1; then
            if CHANGED="$(git diff --name-only "$GITHUB_SHA^1" "$GITHUB_SHA" 2>/dev/null)"; then OK=1; fi
          elif [ -n "$PR_BASE_SHA" ] && [ -n "$PR_HEAD_SHA" ]; then
            if CHANGED="$(git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA" 2>/dev/null)"; then OK=1; fi
          fi

          if [ "$OK" != "1" ]; then
            echo "::warning::detect-deps: no se pudo calcular el diff del PR; se corre OWASP igual"
            echo "deps=true" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$CHANGED" | grep -qE "$DEPS_PATTERN"; then
            echo "El PR toca dependencias: corre OWASP Dependency Check."
            echo "deps=true" >> "$GITHUB_OUTPUT"
          else
            echo "El PR no toca dependencias: OWASP queda para la corrida diaria."
            echo "deps=false" >> "$GITHUB_OUTPUT"
          fi

  # ── OWASP Dependency Check (vulnerabilidades en dependencias) ─────
  # Corre en schedule, workflow_dispatch y en los PR que tocan dependencias.
  # `!cancelled()` es obligatorio: en schedule/dispatch detect-deps queda skipped
  # y, sin función de estado, GitHub saltearía también este job (la corrida
  # diaria no correría nunca y el workflow igual se vería verde).
  dependency-check:
    needs: detect-deps
    if: >-
      !cancelled() && (
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' && needs.detect-deps.outputs.deps == 'true')
      )
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    continue-on-error: true  # Modo warning — no bloquea nada
    concurrency:
      group: security-sast-dependency-check-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    # La credencial se declara a nivel job: el bloque `env:` de un step NO está en
    # scope para el `if:` de ese mismo step, así que sin esto la condición de
    # presencia leería un contexto indefinido y sería siempre verdadera.
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    outputs:
      scan_outcome: ${{ steps.owasp-scan.outcome }}
      report_status: ${{ steps.owasp-report.outputs.status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache NVD data
        uses: actions/cache@v4
        with:
          path: ~/.gradle/dependency-check-data
          key: nvd-data-v2-${{ github.run_id }}
          restore-keys: |
            nvd-data-v2-

      - name: Grant execute permission
        run: chmod +x gradlew

      # $GITHUB_STEP_SUMMARY es append-only en orden de ejecución: el encabezado
      # tiene que salir de un step sin `if:` y ubicado antes de las líneas que encabeza.
      - name: Encabezado del summary OWASP
        run: |
          echo "## OWASP Dependency Check" >> "$GITHUB_STEP_SUMMARY"

      - name: Advertir ejecución sin NVD API key
        if: ${{ env.NVD_API_KEY == '' }}
        run: |
          echo "Estado de credencial: API key del NVD no disponible." >> "$GITHUB_STEP_SUMMARY"
          echo "El scan continúa en modo warning, pero la actualización puede tardar minutos en lugar de segundos por el rate limit anónimo." >> "$GITHUB_STEP_SUMMARY"

      - name: Confirmar NVD API key disponible
        if: ${{ env.NVD_API_KEY != '' }}
        run: |
          echo "Estado de credencial: API key del NVD disponible." >> "$GITHUB_STEP_SUMMARY"

      - name: Run OWASP Dependency Check
        id: owasp-scan
        run: ./gradlew dependencyCheckAggregate --no-daemon
        continue-on-error: true

      - name: Validar reporte OWASP
        id: owasp-report
        if: always()
        shell: bash
        run: |
          if find build/reports -type f -size +0c \( -name 'dependency-check-report.html' -o -name 'dependency-check-report.json' -o -name 'dependency-check-report.xml' \) -print -quit 2>/dev/null | grep -q .; then
            echo "status=present" >> "$GITHUB_OUTPUT"
            echo "Estado del reporte: scan válido; reporte OWASP presente." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "status=missing" >> "$GITHUB_OUTPUT"
            echo "Estado del reporte: reporte ausente; el scan no se considera exitoso." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ steps.owasp-scan.outcome }}" != "success" ]; then
            echo "Estado del scan: scan fallido (modo warning; no bloquea el merge)." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Conteos agregados (sin CVE, paquete ni versión: el repo es público).
      # En un PR de dependencias éste es el único rastro visible, porque ya no
      # se comenta en el PR (fila 7 de #7658).
      - name: Conteos del reporte OWASP
        if: always()
        shell: bash
        run: |
          HTML="$(find build/reports -type f -name 'dependency-check-report.html' -size +0c -print -quit 2>/dev/null || true)"
          if [ -z "$HTML" ]; then
            echo "Conteos: OWASP no terminó; no hay reporte para contar (ver log)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          DEPS="$(grep -oE 'id="vulnerableCount">[0-9]+' "$HTML" | grep -oE '[0-9]+$' | head -1 || true)"
          VULNS="$(grep -oE 'id="vulnerabilityCount">[0-9]+' "$HTML" | grep -oE '[0-9]+$' | head -1 || true)"
          echo "Conteos: dependencias vulnerables ${DEPS:-sin dato}; vulnerabilidades ${VULNS:-sin dato}. Detalle en el artefacto del run (retención 7 días)." >> "$GITHUB_STEP_SUMMARY"

      # El repo es público: el artefacto lo puede bajar cualquier usuario
      # autenticado. Retención corta (RS-5 / CA-8).
      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: build/reports/
          retention-days: 7
          if-no-files-found: ignore

  # ── Semgrep — análisis estático de código Kotlin ─────────────────
  # Sólo schedule / workflow_dispatch (fila 3 de #7658).
  semgrep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Semgrep Static Analysis
    runs-on: ubuntu-latest
    continue-on-error: true  # Modo warning — no bloquea nada
    permissions:
      contents: read
      security-events: write  # upload-sarif a la pestaña Security
    concurrency:
      group: security-sast-semgrep-${{ github.ref }}
      cancel-in-progress: true
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep scan (Kotlin + Java + auto)
        run: |
          semgrep scan \
            --config "p/kotlin" \
            --config "p/java" \
            --config "p/secrets" \
            --config "p/owasp-top-ten" \
            --sarif-output semgrep.sarif \
            --quiet \
            --no-error \
            . || true
        continue-on-error: true

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
        continue-on-error: true

      - name: Extract Semgrep summary
        if: always()
        run: |
          if [ -f semgrep.sarif ]; then
            FINDINGS=$(python3 -c "
          import json, sys
          data = json.load(open('semgrep.sarif'))
          runs = data.get('runs', [])
          count = sum(len(r.get('results', [])) for r in runs)
          print(count)
          " 2>/dev/null || echo "0")
            echo "SEMGREP_FINDINGS=$FINDINGS" >> $GITHUB_ENV
            echo "Semgrep findings: $FINDINGS"
          else
            echo "SEMGREP_FINDINGS=0" >> $GITHUB_ENV
          fi

      - name: Upload Semgrep SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 7
          if-no-files-found: ignore

  # ── detect-secrets — secretos hardcodeados ───────────────────────
  # Sólo schedule / workflow_dispatch (fila 4 de #7658). Frenar un secreto en el
  # PR sigue a cargo de "Secret scan (blocking)".
  detect-secrets:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: detect-secrets Scan
    runs-on: ubuntu-latest
    continue-on-error: true  # Modo warning — no bloquea nada
    permissions:
      contents: read
    concurrency:
      group: security-sast-detect-secrets-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install detect-secrets
        run: pip install detect-secrets --quiet

      - name: Run detect-secrets scan
        run: |
          detect-secrets scan \
            --all-files \
            --exclude-files '\.gradle/' \
            --exclude-files 'build/' \
            --exclude-files '\.git/' \
            --exclude-files 'gradle/wrapper/' \
            --exclude-files '\.idea/' \
            > secrets-baseline.json || true
        continue-on-error: true

      - name: Count secrets found
        run: |
          if [ -f secrets-baseline.json ]; then
            SECRET_COUNT=$(python3 -c "
          import json, sys
          data = json.load(open('secrets-baseline.json'))
          count = sum(len(v) for v in data.get('results', {}).values())
          print(count)
          " 2>/dev/null || echo "0")
            echo "SECRETS_FOUND=$SECRET_COUNT" >> $GITHUB_ENV
            echo "Secrets potenciales encontrados: $SECRET_COUNT"
            if [ "$SECRET_COUNT" -gt 0 ]; then
              echo "--- Archivos con posibles secretos ---"
              python3 -c "
          import json
          data = json.load(open('secrets-baseline.json'))
          for f, hits in data.get('results', {}).items():
              print(f'  {f}: {len(hits)} hallazgo(s)')
          " || true
            fi
          else
            echo "SECRETS_FOUND=0" >> $GITHUB_ENV
          fi

      - name: Upload secrets baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secrets-baseline
          path: secrets-baseline.json
          retention-days: 7
          if-no-files-found: ignore

  # ── Secret scan (blocking) — único control bloqueante ────────────
  # Condición explícita pull_request || push: no corre atado al schedule (su
  # lógica de rango no contempla esos eventos). SIN concurrency a propósito:
  # dos pushes seguidos a main tienen que escanearse ambos hasta el final.
  secret-scan:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    name: Secret scan (blocking)
    runs-on: ubuntu-latest
    continue-on-error: false
    permissions:
      contents: read
    steps:
      # #5244 rev-6 — actions pineadas al SHA de 40 chars (no al tag mutable):
      # un tag puede ser repunteado en silencio por el dueño de la action
      # (trivy-action / kics-github-action). Dejar el tag mutable en el ÚNICO job
      # bloqueante del workflow contradice el alcance del propio issue.
      # Regla: yaml.github-actions.security.github-actions-mutable-action-tag.
      - name: Checkout head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Tres salidas distintas a propósito:
      #   `sha`       → base DECLARADA del PR. Sólo informativa/log: es la
      #                 merge-base de la rama con main, NO el tip de main.
      #   `diff_base` → extremo izquierdo del rango a escanear (lo que ESTE PR agrega).
      #   `decider`   → ref del árbol base que provee scanner/sanitizer/allowlist
      #                 (cadena de confianza D-3). Es el tip REAL de la rama base.
      #
      # #5244 rev-8 — `sha` NO puede gobernar el árbol que decide. Es la merge-base
      # del PR, así que está bajo control del autor: alcanza con no mergear main (o
      # ramificar desde un commit viejo) para que el árbol base quede en una época
      # anterior a este control, caer en bootstrap y correr el scanner del HEAD.
      # Ése es exactamente el bypass que CA-9 cierra. Verificado contra la API:
      # PR 5278 base.sha=ecb552459fb8 ≠ tip de main c0200429504b.
      # `decider` sale de BASE_TIP, que es el tip de la base y no lo mueve el autor
      # del PR. En la vía normal (merge commit efímero) `decider` == `diff_base`,
      # que es lo pedido por el rechazo; en la vía de fallback —sin merge efímero,
      # donde `diff_base` degrada al punto de fork— `decider` sigue siendo el tip.
      # El bloque es shell puro — las expresiones ${{ }} van en env: — para que
      # .pipeline/tests/ci-secret-scan-range.test.js lo extraiga y lo ejecute tal cual.
      - name: Resolver rango del diff
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # #5244 rev-5 — el rango tiene que ser "lo que ESTE PR agrega", nada más.
          # En eventos pull_request, GITHUB_SHA es el merge commit efímero
          # (refs/pull/N/merge): parent1 = tip de la rama base (main ACTUAL),
          # parent2 = head del PR. Por eso el rango PR_BASE_SHA..GITHUB_SHA
          # arrastra todo lo que main avanzó desde que se abrió el PR y el gate
          # bloquea por hallazgos ajenos (PR #5280 frenado por fb03a6b8e, de #5304).
          # Se acota con merge-base contra el tip REAL de la base: main queda a
          # ambos lados del rango y sale del diff.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_TIP=""
            # #5244 rev-9 — `decider_trusted` distingue si BASE_TIP es de verdad
            # el tip de la rama base (resuelto contra el merge efímero o contra
            # el ref remoto: ninguno lo mueve el autor del PR) o si degradó a la
            # merge-base declarada, que SÍ está bajo su control. Sólo con
            # `decider_trusted=1` se admite el alta del control (ver el step
            # "Secret scan del diff"); con 0 se mantiene el fail-closed.
            DECIDER_TRUSTED=0
            # parent1 sólo se usa si GITHUB_SHA es de verdad el merge efímero:
            # si el checkout fuera el head del PR, `^1` sería el commit anterior
            # de la propia rama y el rango se achicaría (fail-open).
            if [ -n "$PR_HEAD_SHA" ] && [ "$GITHUB_SHA" != "$PR_HEAD_SHA" ] \
               && git rev-parse -q --verify "$GITHUB_SHA^2" >/dev/null 2>&1; then
              BASE_TIP="$(git rev-parse "$GITHUB_SHA^1")"
              DECIDER_TRUSTED=1
            elif [ -n "$PR_BASE_REF" ]; then
              BASE_TIP="$(git rev-parse -q --verify "origin/$PR_BASE_REF" 2>/dev/null || true)"
              if [ -n "$BASE_TIP" ]; then DECIDER_TRUSTED=1; fi
            fi
            if [ -z "$BASE_TIP" ]; then
              BASE_TIP="$PR_BASE_SHA"
              DECIDER_TRUSTED=0
            fi

            DIFF_BASE="$(git merge-base "$BASE_TIP" "$GITHUB_SHA" 2>/dev/null || true)"
            if [ -z "$DIFF_BASE" ]; then
              # Sin ancestro común no hay forma de acotar. Se cae a la base
              # declarada del PR: escanea de más, nunca de menos (fail-closed),
              # y queda declarado en el log en vez de degradar en silencio.
              DIFF_BASE="$PR_BASE_SHA"
              echo "::warning::secret-scan: sin merge-base entre $BASE_TIP y $GITHUB_SHA; se escanea desde la base declarada del PR"
            fi

            echo "sha=$PR_BASE_SHA" >> "$GITHUB_OUTPUT"
            echo "diff_base=$DIFF_BASE" >> "$GITHUB_OUTPUT"
            echo "decider=$BASE_TIP" >> "$GITHUB_OUTPUT"
            echo "decider_trusted=$DECIDER_TRUSTED" >> "$GITHUB_OUTPUT"
            echo "secret-scan: rango $DIFF_BASE..$GITHUB_SHA (árbol que decide: $BASE_TIP, confiable=$DECIDER_TRUSTED; base declarada del PR: $PR_BASE_SHA)"
          else
            # En `push` el rango sale del propio historial de la rama protegida:
            # `before` no lo elige el autor de un PR, así que el árbol que decide
            # es confiable por construcción.
            B="$PUSH_BEFORE"
            case "$B" in ''|0000000*) B="$(git rev-parse HEAD~1)" ;; esac
            echo "sha=$B" >> "$GITHUB_OUTPUT"
            echo "diff_base=$B" >> "$GITHUB_OUTPUT"
            echo "decider=$B" >> "$GITHUB_OUTPUT"
            echo "decider_trusted=1" >> "$GITHUB_OUTPUT"
            echo "secret-scan: rango $B..$GITHUB_SHA"
          fi

      - name: Checkout base completo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.base.outputs.decider }}
          path: .base
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      # Todo lo que decide (scanner, sanitizer, allowlist) sale del árbol base.
      # Del head sólo salen los datos: el diff. El bloque es shell puro —
      # las expresiones ${{ }} van arriba, en env — para que
      # .pipeline/tests/ci-secret-scan-step.test.js lo extraiga y lo ejecute tal cual.
      - name: Secret scan del diff
        env:
          # Rango acotado por merge-base (#5244 rev-5), NO la base declarada:
          # ésta última sólo gobierna de qué árbol sale el scanner.
          BASE_SHA: ${{ steps.base.outputs.diff_base }}
          # 1 sólo si el árbol que decide es el tip REAL de la rama base
          # (#5244 rev-9). Vacío o distinto de 1 ⇒ fail-closed.
          DECIDER_TRUSTED: ${{ steps.base.outputs.decider_trusted }}
        run: |
          BASE_TREE="$GITHUB_WORKSPACE/.base"
          BASE_SCANNER="$BASE_TREE/.pipeline/lib/precommit-secret-scan.js"

          # #5244 CA-9 — el scanner que decide viene del BASE, no del head: si
          # corriera el del head, un PR que neutraliza el scanner en su propio
          # diff pasaría en verde con un secreto adentro (`.pipeline/` está
          # fuera de CODEOWNERS por D-4, así que nadie lo frena a mano).
          # "El archivo existe" no alcanza: el scanner viejo ignora los flags y
          # sale 0 sin mirar el rango. Se exige el protocolo declarado.
          SCANNER="$BASE_SCANNER"
          BASE_CAPS=""
          if [ -f "$BASE_SCANNER" ]; then
            BASE_CAPS="$(node "$BASE_SCANNER" --capabilities 2>/dev/null || true)"
          fi
          case "$BASE_CAPS" in
            *secret-scan-protocol=range-v1*)
              echo "secret-scan: scanner del árbol base (fail-closed)" ;;
            *)
              # Bootstrap: el ref base es anterior a este control. Único caso en
              # el que correría el scanner del head — y es justo el que un PR
              # hostil busca alcanzar.
              #
              # #5244 rev-8 — FAIL-CLOSED sobre paths de CONTROL. Si el diff toca
              # el propio mecanismo de detección, el head no puede auto-habilitarse:
              # no queda ningún árbol confiable que pueda juzgarlo, así que se
              # bloquea sin ejecutar nada suyo. Cubre la vía de fallback de
              # BASE_TIP (PR sin merge commit efímero), donde el árbol que decide
              # puede seguir siendo anterior a este control.
              #
              # #5244 rev-9 — ese fail-closed, aplicado sin distinción, se cerraba
              # sobre el ÚNICO PR que necesita la ventana: instalar el control ES
              # tocar paths de control, así que el gate se bloqueaba a sí mismo y
              # no existía ningún camino por el que pudiera llegar a la base
              # (deadlock de bootstrap). Hay dos situaciones distintas:
              #
              #   (a) ALTA — la rama base no tiene el gate server-side EN ABSOLUTO.
              #       En ese estado el control no está vigente y no hay nada que
              #       bypassear: un PR hostil ni siquiera necesita neutralizar el
              #       scanner, le alcanza con no agregar el job y no corre ningún
              #       check. El fail-closed no protegía nada ahí, sólo impedía el
              #       alta. Se admite correr el scanner del head bajo las cuatro
              #       condiciones de abajo, declarándolo con ::warning.
              #   (b) DEGRADACIÓN — la base YA tiene el gate y este diff baja el
              #       protocolo. Eso es desactivar un control vigente: fail-closed
              #       de rev-8, sin excepción.
              #
              # El discriminante NO puede ser `! -f "$BASE_SCANNER"`:
              # .pipeline/lib/precommit-secret-scan.js existe en main desde antes
              # de este issue (verificado: `git ls-tree origin/main .pipeline/lib/`),
              # así que esa condición nunca distinguiría (a) de (b). El
              # discriminante correcto es la presencia del JOB en el workflow base,
              # que es lo que hace al control vigente server-side.
              CONTROL_HITS="$(git -C "$GITHUB_WORKSPACE" diff --name-only "$BASE_SHA" "$GITHUB_SHA" 2>/dev/null \
                | grep -E '^(\.pipeline/lib/[^/]*secret[^/]*|\.pipeline/lib/sensitive-paths\.js|\.pipeline/sanitizer\.js|\.pipeline/secret-scan-allowlist\.json|\.claude/hooks/telegram-sanitizer\.js|\.husky/pre-commit|\.github/workflows/security-sast\.yml)$' \
                || true)"
              if [ -n "$CONTROL_HITS" ]; then
                # (1) El árbol base no declara el job ⇒ el control no está vigente.
                #     Fail-closed sobre la lectura: si `.base` no está, se asume
                #     que SÍ hay gate y se bloquea.
                BASE_WORKFLOW="$BASE_TREE/.github/workflows/security-sast.yml"
                BASE_HAS_GATE=1
                if [ -d "$BASE_TREE" ]; then
                  if [ ! -f "$BASE_WORKFLOW" ]; then
                    BASE_HAS_GATE=0
                  elif ! grep -qE '^  secret-scan:[[:space:]]*$' "$BASE_WORKFLOW"; then
                    BASE_HAS_GATE=0
                  fi
                fi

                # (2) El head declara el job: sin esto no es un alta, es otra cosa.
                HEAD_HAS_GATE=0
                if git -C "$GITHUB_WORKSPACE" show "$GITHUB_SHA:.github/workflows/security-sast.yml" 2>/dev/null \
                   | grep -qE '^  secret-scan:[[:space:]]*$'; then
                  HEAD_HAS_GATE=1
                fi

                # (3) El head instala el protocolo DE VERDAD. Un scanner
                #     neutralizado (el escenario que levantó QA en rev-8) no
                #     expone capacidades y no alcanza el alta.
                SCANNER_HEAD="$GITHUB_WORKSPACE/.pipeline/lib/precommit-secret-scan.js"
                HEAD_CAPS=""
                if [ -f "$SCANNER_HEAD" ]; then
                  HEAD_CAPS="$(node "$SCANNER_HEAD" --capabilities 2>/dev/null || true)"
                fi

                # (4) DECIDER_TRUSTED=1: el árbol que decide es el tip real de la
                #     rama base. Si degradó a la merge-base declarada (que el autor
                #     controla), el estado "la base no tiene el gate" no es
                #     verificable y se mantiene el bloqueo.
                ALTA=0
                if [ "$DECIDER_TRUSTED" = "1" ] && [ "$BASE_HAS_GATE" = "0" ] && [ "$HEAD_HAS_GATE" = "1" ]; then
                  case "$HEAD_CAPS" in *secret-scan-protocol=range-v1*) ALTA=1 ;; esac
                fi

                if [ "$ALTA" != "1" ]; then
                  echo "::error::secret-scan BLOQUEADO (bootstrap sobre paths de control): el ref base no expone secret-scan-protocol=range-v1 y este diff modifica el propio control de secretos, así que no existe scanner confiable para juzgarlo. Paths: $(echo "$CONTROL_HITS" | tr '\n' ' ')"
                  echo "::error::Diagnóstico: decider_trusted=$DECIDER_TRUSTED base_gate=$BASE_HAS_GATE head_gate=$HEAD_HAS_GATE head_caps='$HEAD_CAPS'"
                  echo "::error::Remediación: si la base YA tiene el job secret-scan (base_gate=1), este PR está bajando un control vigente y el bloqueo es correcto: restituí secret-scan-protocol=range-v1. Si la base NO lo tiene (base_gate=0), el alta requiere además head_gate=1, un scanner del head que exponga el protocolo y decider_trusted=1 (mergeá origin/main en la rama para que el PR tenga merge commit efímero)."
                  exit 1
                fi

                # Alta declarada y auditable. No se silencia: queda en el log del
                # run con los paths exactos. Además es de un solo uso por
                # construcción — en cuanto el job entra a la rama base,
                # BASE_HAS_GATE pasa a 1 y este camino no se vuelve a tomar — y no
                # es alcanzable sin review humana: para que HEAD_HAS_GATE sea 1 el
                # PR tiene que tocar .github/workflows/, cubierto por
                # `/.github/ @leitolarreta` en CODEOWNERS con
                # require_code_owner_review activo (R-7).
                echo "::warning::secret-scan ALTA DEL CONTROL: la rama base todavía no declara el job secret-scan, así que no hay control vigente que este diff pueda estar desactivando. Se admite el bootstrap por única vez y corre el scanner del head, que sí expone secret-scan-protocol=range-v1. Paths de control en el diff: $(echo "$CONTROL_HITS" | tr '\n' ' ')"
              fi
              SCANNER="$GITHUB_WORKSPACE/.pipeline/lib/precommit-secret-scan.js"
              echo "::warning::secret-scan bootstrap: el ref base no expone secret-scan-protocol=range-v1; corre el scanner de HEAD" ;;
          esac

          BASE_ALLOWLIST="$BASE_TREE/.pipeline/secret-scan-allowlist.json"
          if [ ! -f "$BASE_ALLOWLIST" ]; then
            BASE_ALLOWLIST="$RUNNER_TEMP/secret-scan-bootstrap-allowlist.json"
            # Política bootstrap confiable: el base aún no tiene allowlist.
            # Sin excepciones — los fixtures de test arman sus tokens en
            # runtime, así que no necesitan una exención permanente sobre un
            # path escribible y fuera de CODEOWNERS (#5244 rev-1).
            printf '{"paths":[],"globs":[]}\n' > "$BASE_ALLOWLIST"
          fi

          node "$SCANNER" \
            --mode=range --base="$BASE_SHA" --head="$GITHUB_SHA" \
            --cwd="$GITHUB_WORKSPACE" \
            --sanitizer="$BASE_TREE/.pipeline/sanitizer.js" \
            --allowlist="$BASE_ALLOWLIST" \
            --format=github

  # ── Resumen de la corrida diaria / a demanda + aviso al operador ──
  # Reemplaza a "Publicar reporte SAST en PR" (fila 7 de #7658): ya no se comenta
  # en el PR. El resumen va al step summary del run y, si hay hallazgos o alguna
  # herramienta no terminó, se avisa al operador por Telegram (canal privado).
  # Sólo conteos + links: nunca CVE, paquete, versión ni archivo:línea (RS-5).
  sast-summary:
    name: Resumen SAST (corrida diaria / a demanda)
    runs-on: ubuntu-latest
    needs: [dependency-check, semgrep, detect-secrets]
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
    steps:
      - name: Download OWASP report
        uses: actions/download-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: reports/owasp/
        continue-on-error: true

      - name: Download Semgrep SARIF
        uses: actions/download-artifact@v4
        with:
          name: semgrep-sarif
          path: reports/semgrep/
        continue-on-error: true

      - name: Download secrets baseline
        uses: actions/download-artifact@v4
        with:
          name: secrets-baseline
          path: reports/secrets/
        continue-on-error: true

      # Todas las expresiones entran por env: el script no interpola nada.
      - name: Generar resumen
        id: summary
        env:
          DEP_OUTCOME: ${{ needs.dependency-check.outputs.scan_outcome }}
          DEP_REPORT: ${{ needs.dependency-check.outputs.report_status }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const findFile = (dir, name) => {
            try {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  const hit = findFile(full, name);
                  if (hit) return hit;
                } else if (entry.name === name && fs.statSync(full).size > 0) {
                  return full;
                }
              }
            } catch {}
            return null;
          };

          // OWASP: mismo vocabulario de estado que el summary del job.
          const depCheckOutcome = process.env.DEP_OUTCOME || '';
          const depCheckReportStatus = process.env.DEP_REPORT || '';
          const depCheckState = depCheckOutcome !== 'success'
            ? 'scan fallido'
            : depCheckReportStatus !== 'present'
              ? 'reporte ausente'
              : 'scan válido';
          let owasp = { done: false, deps: null, vulns: null };
          const owaspHtml = findFile('reports/owasp', 'dependency-check-report.html');
          if (depCheckState === 'scan válido' && owaspHtml) {
            const html = fs.readFileSync(owaspHtml, 'utf8');
            const num = (id) => {
              const m = html.match(new RegExp('id="' + id + '">\\s*(\\d+)'));
              return m ? Number(m[1]) : null;
            };
            owasp = { done: true, deps: num('vulnerableCount'), vulns: num('vulnerabilityCount') };
          }

          // Semgrep: conteo por nivel del SARIF.
          let semgrep = { done: false, total: 0, levels: {} };
          try {
            const sarif = JSON.parse(fs.readFileSync('reports/semgrep/semgrep.sarif', 'utf8'));
            const levels = {};
            let total = 0;
            for (const run of sarif.runs || []) {
              for (const r of run.results || []) {
                const level = r.level || 'warning';
                levels[level] = (levels[level] || 0) + 1;
                total += 1;
              }
            }
            semgrep = { done: true, total, levels };
          } catch {}

          // detect-secrets: candidatos del inventario.
          let secrets = { done: false, total: 0 };
          try {
            const baseline = JSON.parse(fs.readFileSync('reports/secrets/secrets-baseline.json', 'utf8'));
            const total = Object.values(baseline.results || {}).reduce((acc, v) => acc + v.length, 0);
            secrets = { done: true, total };
          } catch {}

          const fmt = (n) => Number(n).toLocaleString('es-AR');
          const incompletas = [];
          if (!owasp.done) incompletas.push('OWASP Dependency Check (' + depCheckState + ')');
          if (!semgrep.done) incompletas.push('Semgrep');
          if (!secrets.done) incompletas.push('detect-secrets');

          const owaspHallazgos = owasp.done ? (owasp.vulns ?? owasp.deps ?? 0) : 0;
          const total = owaspHallazgos + semgrep.total + secrets.total;

          const base = process.env.GITHUB_SERVER_URL + '/' + process.env.GITHUB_REPOSITORY;
          const runUrl = base + '/actions/runs/' + process.env.GITHUB_RUN_ID;
          const securityUrl = base + '/security/code-scanning';

          const veredicto = incompletas.length > 0
            ? '⚠️ Corrida incompleta: no terminó ' + incompletas.join(', ') + ' (ver log). Un cero de esa herramienta no significa "sin hallazgos".'
            : total > 0
              ? '⚠️ ' + fmt(total) + ' hallazgos'
              : '✅ Sin hallazgos';

          const sinDato = (n) => (n == null ? 'sin dato' : fmt(n));
          const celdaOwasp = owasp.done
            ? sinDato(owasp.vulns) + ' vulnerabilidades en ' + sinDato(owasp.deps) + ' dependencias'
            : 'no terminó (' + depCheckState + ')';
          const niveles = Object.entries(semgrep.levels).map(([k, v]) => k + ': ' + fmt(v)).join(', ');
          const celdaSemgrep = semgrep.done
            ? fmt(semgrep.total) + (niveles ? ' (' + niveles + ')' : '')
            : 'no terminó';
          const celdaSecrets = secrets.done ? fmt(secrets.total) + ' candidatos' : 'no terminó';

          const md = [
            '## Security SAST — resumen de la corrida',
            '',
            '**' + veredicto + '**',
            '',
            '| Herramienta | Resultado |',
            '|---|---|',
            '| OWASP Dependency Check | ' + celdaOwasp + ' |',
            '| Semgrep | ' + celdaSemgrep + ' |',
            '| detect-secrets | ' + celdaSecrets + ' |',
            '',
            'Detalle: [pestaña Security](' + securityUrl + ') · [artefactos del run](' + runUrl + ') (retención 7 días).',
            '',
            'Modo warning: estos escaneos no bloquean. El único control bloqueante es "Secret scan (blocking)", en cada PR y en cada push a main.',
            '',
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);

          // Aviso al operador: sólo si hay hallazgos o si algo no terminó.
          const avisar = incompletas.length > 0 || total > 0;
          const partes = [];
          if (owaspHallazgos > 0) partes.push(fmt(owaspHallazgos) + ' vulnerabilidades en dependencias');
          if (semgrep.total > 0) partes.push(fmt(semgrep.total) + ' avisos de código de Semgrep');
          if (secrets.total > 0) partes.push(fmt(secrets.total) + ' posibles secretos para revisar');
          const encontrados = partes.length > 0 ? 'encontró ' + partes.join(', ') : 'no encontró hallazgos';
          const incompleto = incompletas.length > 0
            ? ' Ojo: ' + (incompletas.length === 1 ? 'una herramienta no terminó' : 'algunas herramientas no terminaron')
              + ' (' + incompletas.join(', ') + '), así que el resultado está incompleto.'
            : '';
          const cuerpo = 'El análisis de seguridad de main ' + encontrados + '.' + incompleto
            + ' Conviene revisarlo antes del próximo release.';
          const texto = cuerpo + '\n\nDónde mirar: pestaña Security ' + securityUrl + '\nCorrida: ' + runUrl;
          const audio = cuerpo + ' El detalle está en la pestaña Security del repositorio.';

          const tmp = process.env.RUNNER_TEMP;
          fs.writeFileSync(path.join(tmp, 'sast-aviso.txt'), texto);
          fs.writeFileSync(path.join(tmp, 'sast-aviso-audio.txt'), audio);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'notify=' + (avisar ? 'true' : 'false') + '\n');
          NODE

      # Canal privado del operador (RS-5). Mensaje + audio (convención del canal).
      # Si los secrets no están cargados, lo declara en el summary y no falla.
      - name: Avisar al operador por Telegram
        if: steps.summary.outputs.notify == 'true'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Aviso al operador no enviado: faltan los secrets TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID"
            echo "Aviso al operador: no enviado, el canal privado no está configurado (faltan los secrets de Telegram)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if curl -sS --fail -o /dev/null -X POST \
               "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
               --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
               --data-urlencode "text@${RUNNER_TEMP}/sast-aviso.txt"; then
            echo "Aviso al operador: enviado por Telegram." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::No se pudo enviar el aviso por Telegram"
            echo "Aviso al operador: falló el envío por Telegram." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if pip install --quiet edge-tts \
             && edge-tts --voice es-AR-TomasNeural --pitch=-2Hz \
                  --file "${RUNNER_TEMP}/sast-aviso-audio.txt" \
                  --write-media "${RUNNER_TEMP}/sast-aviso.mp3" \
             && curl -sS --fail -o /dev/null -X POST \
                  "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendAudio" \
                  -F "chat_id=${TELEGRAM_CHAT_ID}" \
                  -F "title=Análisis de seguridad" \
                  -F "audio=@${RUNNER_TEMP}/sast-aviso.mp3"; then
            echo "Aviso al operador: audio enviado." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::El aviso de texto salió, pero no se pudo generar o enviar el audio"
          fi
